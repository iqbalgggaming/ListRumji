                <span class="number">04</span>

            <div class="settings">
                <label>Role</label>
                <select class="role" data-selected="Fighter">
                    <option>Tank</option>
                    <option>Fighter</option>

    </div>

</main>

<footer>
    <p>© 2026 RUMJI SQUAD | TEAM 2</p>
</footer>

<script>
const heroes = {
    Tank: [
        "Tigreal", "Atlas", "Khufra", "Franco", "Johnson",
        "Lolita", "Minotaur", "Belerick", "Hylos",
        "Gatotkaca", "Uranus", "Gloo", "Edith",
        "Barats", "Akai", "Grock", "Chip", "Kalea"
    ],

    Fighter: [
        "Terizla", "Sun", "Yu Zhong", "Paquito",
        "Chou", "Aldous", "Dyrroth", "Thamuz",
        "X.Borg", "Leomord", "Ruby", "Alpha",
        "Badang", "Balmond", "Freya", "Martis",
        "Arlott", "Cici", "Phoveus", "Minsitthar"
    ],

    Assassin: [
        "Fanny", "Ling", "Hayabusa", "Lancelot",
        "Gusion", "Karina", "Saber", "Natalia",
        "Helcurt", "Hanzo", "Aamon", "Joy",
        "Nolan", "Benedetta", "Selena"
    ],

    Marksman: [
        "Claude", "Miya", "Brody", "Beatrix",
        "Layla", "Granger", "Bruno", "Clint",
        "Karrie", "Wanwan", "Melissa", "Irithel",
        "Lesley", "Hanabi", "Moskov", "Ixia",
        "Popol and Kupa", "Kimmy", "Natan"
    ],

    Mage: [
        "Nana", "Zetian", "Lunox", "Valentina",
        "Kagura", "Eudora", "Aurora", "Lylia",
        "Cecilion", "Yve", "Pharsa", "Xavier",
        "Vexana", "Chang'e", "Odette", "Vale",
        "Valir", "Harith", "Luo Yi", "Novaria",
        "Zhuxin", "Gord", "Cyclops", "Gatotkaca"
    ],

    Support: [
        "Angela", "Estes", "Rafaela", "Floryn",
        "Mathilda", "Diggie", "Carmilla", "Kaja"
    ]
};

document.querySelectorAll(".member").forEach(member => {
    const role = member.querySelector(".role");
    const hero = member.querySelector(".hero");

    function updateHeroes() {
        const selectedHero = hero.dataset.selected || "";

        hero.innerHTML = "";

        heroes[role.value].forEach(name => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;

            hero.appendChild(option);
        });

        if (heroes[role.value].includes(selectedHero)) {
            hero.value = selectedHero;
        } else {
            hero.selectedIndex = 0;
        }

        hero.dataset.selected = hero.value;
    }

    role.value = role.dataset.selected;
    updateHeroes();

    hero.addEventListener("change", () => {
        hero.dataset.selected = hero.value;
    });

    role.addEventListener("change", () => {
        hero.dataset.selected = "";
        updateHeroes();
    });
});
</script>

</body>
</html>
